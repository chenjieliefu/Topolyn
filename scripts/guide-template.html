    <section class="page-hero site-shell"><p class="site-kicker" data-zh="场景指南 · [[RECIPE_COUNT]] 种判断方式" data-en="Scenario guide · [[RECIPE_COUNT]] ways to reason">场景指南 · [[RECIPE_COUNT]] 种判断方式</p><h1 class="site-title" data-zh-html="了解 Topolyn 如何<em>理解场景。</em>" data-en-html="See how Topolyn <em>understands scenarios.</em>">了解 Topolyn 如何<em>理解场景。</em></h1><p class="site-lede" data-zh="这里是工作台背后的场景知识库。你不需要在这里重复输入想法；直接去工作台聊天，Topolyn 会自动推荐合适的表达方式并继续追问。" data-en="This is the scenario library behind the workspace. You do not need to enter your idea twice—chat in the workspace and Topolyn will recommend the right visual form and follow up.">这里是工作台背后的场景知识库。你不需要在这里重复输入想法；直接去工作台聊天，Topolyn 会自动推荐合适的表达方式并继续追问。</p><div class="hero-actions" style="justify-content:center;margin-top:24px"><a class="hero-button primary" href="workspace.html" data-zh="去工作台说出想法 →" data-en="Tell the workspace your idea →">去工作台说出想法 →</a></div></section>

  <script id="guide-data" type="application/json">[[GUIDE_JSON]]</script>
  <script src="assets/topolyn-site.js"></script>
  <script>
  (()=>{
    const recipes=JSON.parse(document.getElementById('guide-data').textContent);const grid=document.getElementById('guide-grid');let type='all';
    const language=()=>window.TopolynSite?.language||'zh';
    const workspaceLink=recipe=>`workspace.html?scenario=${encodeURIComponent(recipe.id)}&source=guide`;
    const render=()=>{grid.replaceChildren();recipes.filter(r=>type==='all'||r.type===type).forEach(recipe=>{const copy=recipe[language()];const card=document.createElement('article');card.className='guide-card';card.dataset.type=recipe.type;const tag=document.createElement('span');tag.className='type';tag.textContent=recipe.type;const h=document.createElement('h3');h.textContent=copy.title;const q=document.createElement('p');q.textContent=copy.question;const summary=document.createElement('p');summary.textContent=copy.summary;const foot=document.createElement('footer');const use=document.createElement('a');use.href=workspaceLink(recipe);use.textContent=language()==='zh'?'按此思路开始':'Start with this lens';const proof=document.createElement('a');proof.href=`gallery.html#proof-${recipe.proof}`;proof.textContent=language()==='zh'?'查看成品':'View proof';foot.append(use,proof);card.append(tag,h,q,summary,foot);grid.append(card)})};
    document.getElementById('guide-filters').addEventListener('click',event=>{const button=event.target.closest('button[data-type]');if(!button)return;type=button.dataset.type;document.querySelectorAll('#guide-filters button').forEach(item=>item.classList.toggle('active',item===button));render()});window.addEventListener('topolyn:language',render);render();
  })();
  </script>
