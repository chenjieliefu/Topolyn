  <script id="gallery-manifest" type="application/json">[[MANIFEST_JSON]]</script>
  <script src="assets/topolyn-site.js"></script>
  <script>
  (()=>{
    const filters=document.getElementById('gallery-filters');
    const syncArtifactLanguage=language=>{
      const lang=language==='en'?'en':'zh';
      document.querySelectorAll('iframe[data-src-zh][data-src-en]').forEach(frame=>{
        const next=frame.dataset[`src${lang==='zh'?'Zh':'En'}`];
        if(frame.getAttribute('src')!==next)frame.setAttribute('src',next);
        frame.title=frame.dataset[`title${lang==='zh'?'Zh':'En'}`];
      });
      document.querySelectorAll('[data-href-zh][data-href-en]').forEach(link=>{
        link.setAttribute('href',link.dataset[`href${lang==='zh'?'Zh':'En'}`]);
      });
    };
    filters.addEventListener('click',event=>{const button=event.target.closest('button[data-type]');if(!button)return;filters.querySelectorAll('button').forEach(item=>item.classList.toggle('active',item===button));document.querySelectorAll('.showcase-card').forEach(card=>{card.hidden=button.dataset.type!=='all'&&card.dataset.type!==button.dataset.type})});
    window.addEventListener('topolyn:language',event=>syncArtifactLanguage(event.detail.language));
    syncArtifactLanguage(window.TopolynSite?.language||'zh');
  })();
  </script>
