<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Topolyn product preview</title>
  <desc id="desc">A clean Topolyn system map inside a light, translucent product window.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1190" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F5F5F7"/>
      <stop offset="1" stop-color="#EAF4FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5AC8FA"/>
      <stop offset=".5" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0066CC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#1D1D1F" flood-opacity=".12"/>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#1D1D1F" flood-opacity=".11"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="32" fill="url(#bg)"/>
  <circle cx="1100" cy="36" r="250" fill="#0A84FF" opacity=".055"/>
  <circle cx="82" cy="630" r="260" fill="#BF5AF2" opacity=".045"/>

  <g transform="translate(72 62)">
    <rect width="52" height="52" rx="15" fill="url(#brand)"/>
    <path d="M17 33 26 16l10 19M17 33h19" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="26" cy="16" r="3.1" fill="#fff"/><circle cx="17" cy="33" r="3.1" fill="#fff"/><circle cx="36" cy="35" r="3.1" fill="#fff"/>
    <text x="70" y="30" fill="#1D1D1F" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="31" font-weight="650" letter-spacing="-1.2">Topolyn</text>
    <text x="70" y="51" fill="#6E6E73" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" letter-spacing=".2">SEE THE SYSTEM.</text>
  </g>

  <g transform="translate(72 146)" filter="url(#shadow)">
    <rect width="1136" height="424" rx="27" fill="#FFFFFF" fill-opacity=".82" stroke="#000" stroke-opacity=".07"/>
    <path d="M0 62h1136" stroke="#000" stroke-opacity=".07"/>
    <circle cx="28" cy="31" r="6" fill="#FF5F57"/><circle cx="48" cy="31" r="6" fill="#FEBC2E"/><circle cx="68" cy="31" r="6" fill="#28C840"/>
    <text x="94" y="36" fill="#6E6E73" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500">Commerce Platform · Runtime Map</text>
    <g transform="translate(885 15)">
      <rect width="68" height="32" rx="16" fill="#F2F2F7"/><text x="19" y="21" fill="#3A3A3C" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11">Light</text>
      <rect x="78" width="76" height="32" rx="16" fill="#0071E3"/><text x="98" y="21" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600">Export</text>
    </g>

    <g transform="translate(42 91)">
      <text x="0" y="12" fill="#8E8E93" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">REQUEST PATH</text>
      <text x="0" y="43" fill="#1D1D1F" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="650" letter-spacing="-.5">From customer intent to confirmed order</text>
      <text x="0" y="67" fill="#6E6E73" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13">A typed, explorable system map generated from plain language.</text>
    </g>

    <g stroke="#8E8E93" stroke-width="2" fill="none" stroke-linecap="round" opacity=".72">
      <path d="M218 260H325"/><path d="M505 260H612"/><path d="M792 260H899"/>
      <path d="m316 254 9 6-9 6M603 254l9 6-9 6M890 254l9 6-9 6"/>
      <path d="M415 300v49h197"/><path d="m603 343 9 6-9 6"/>
    </g>

    <g filter="url(#nodeShadow)" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
      <g transform="translate(42 218)"><rect width="176" height="84" rx="18" fill="#EAF6FF" stroke="#0071E3" stroke-opacity=".65"/><circle cx="25" cy="26" r="8" fill="#0A84FF"/><text x="43" y="31" fill="#1D1D1F" font-size="14" font-weight="650">Storefront</text><text x="20" y="58" fill="#6E6E73" font-size="11">Customer experience</text></g>
      <g transform="translate(325 218)"><rect width="180" height="84" rx="18" fill="#ECF9F0" stroke="#248A3D" stroke-opacity=".58"/><circle cx="25" cy="26" r="8" fill="#30D158"/><text x="43" y="31" fill="#1D1D1F" font-size="14" font-weight="650">Commerce API</text><text x="20" y="58" fill="#6E6E73" font-size="11">Orders · Pricing · Stock</text></g>
      <g transform="translate(612 218)"><rect width="180" height="84" rx="18" fill="#F7EEFB" stroke="#8944AB" stroke-opacity=".55"/><circle cx="25" cy="26" r="8" fill="#BF5AF2"/><text x="43" y="31" fill="#1D1D1F" font-size="14" font-weight="650">Order Store</text><text x="20" y="58" fill="#6E6E73" font-size="11">Durable business state</text></g>
      <g transform="translate(899 218)"><rect width="193" height="84" rx="18" fill="#FFF7E8" stroke="#B25000" stroke-opacity=".5"/><circle cx="25" cy="26" r="8" fill="#FF9F0A"/><text x="43" y="31" fill="#1D1D1F" font-size="14" font-weight="650">Payment Cloud</text><text x="20" y="58" fill="#6E6E73" font-size="11">External confirmation</text></g>
      <g transform="translate(612 338)"><rect width="180" height="58" rx="16" fill="#FFF0EF" stroke="#D70015" stroke-opacity=".45"/><circle cx="25" cy="22" r="7" fill="#FF453A"/><text x="43" y="27" fill="#1D1D1F" font-size="13" font-weight="650">Risk Service</text></g>
    </g>
  </g>
</svg>
